<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Status Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        input {
            padding: 10px;
            width: 300px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 15px;
        }
        #result {
            margin-top: 15px;
            font-size: 20px;
        }
    </style>
</head>
<body>

<h1>Website Status Checker</h1>
<p>This tool checks if a website is down.</p>
<input type="text" id="url" placeholder="Enter website URL (e.g. example.com)" />
<button onclick="checkStatus()">Check Status</button>
<p id="result"></p>

<script>
    async function checkStatus() {
        const url = document.getElementById('url').value;
        const result = document.getElementById('result');
        try {
            const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('http://' + url)}`);
            if (response.ok) {
                result.textContent = 'The website is up!';
            } else {
                result.textContent = 'The website is down.';
            }
        } catch (error) {
            result.textContent = 'The website is down.';
        }
    }
</script>

</body>
</html>
