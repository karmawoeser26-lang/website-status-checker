<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Down Checker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #111827;
    }

    main {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 32px;
    }

    p {
      margin: 0 0 24px;
      line-height: 1.5;
      color: #4b5563;
    }

    form {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 14px 18px;
      border: 0;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #result {
      margin-top: 22px;
      font-size: 22px;
      font-weight: bold;
      min-height: 30px;
    }

    @media (max-width: 480px) {
      form {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Website Down Checker</h1>

    <p>
      This free tool is for anyone who wants to quickly check whether a website is reachable online.
    </p>

    <form id="checkForm">
      <input
        id="url"
        type="text"
        placeholder="example.com"
        autocomplete="url"
        required
      >

      <button id="checkButton" type="submit">Check</button>
    </form>

    <div id="result" aria-live="polite"></div>
  </main>

  <script>
    const form = document.getElementById("checkForm");
    const input = document.getElementById("url");
    const button = document.getElementById("checkButton");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const value = input.value.trim();

      if (!value) {
        result.textContent = "Enter a website address.";
        return;
      }

      button.disabled = true;
      result.textContent = "Checking...";

      try {
        const response = await fetch(
          `/.netlify/functions/check-site?url=${encodeURIComponent(value)}`
        );

        const data = await response.json();

        if (data.status === "up") {
          result.textContent = "The website is up.";
        } else if (data.status === "down") {
          result.textContent = "The website appears to be down.";
        } else {
          result.textContent = "Could not determine the website status.";
        }
      } catch (error) {
        result.textContent = "Could not check that website.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
